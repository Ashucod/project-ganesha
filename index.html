<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Aarti | Ganesh Chaturthi</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="mandir-background">
        <header class="app-header">
            <h1>Shree Ganeshay Namah</h1>
            <p>Experience the divine presence</p>
            <button id="start-aarti-btn" class="main-action">Start Aarti</button>
        </header>
        <main class="shrine-container">
            <img src="assets/images/bell.png" id="temple-bell" class="interactive-bell" alt="Temple Bell">
            <img src="assets/images/ganpati_idol.png" class="idol" alt="Lord Ganesha">

            <div class="samagri-tray">
                <img src="assets/images/samagri.png" alt="Puja Samagri">
            </div>
            <div id="cursor-thali-container" class="thali-container hidden">
                <img src="assets/images/aarti_thali.png" alt="Aarti Thali">
            </div>

        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
